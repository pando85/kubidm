[package]
name = "kubidm_tools"
default-run = "kubidm"
description = "Kubidm Client Tools"
documentation = "https://kubidm.github.io/kubidm/stable/"
version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[lints.clippy]
result_large_err = "allow"

[features]
default = [
    "unix",
    # "dev-oauth2-device-flow"
]
unix = []
dev-oauth2-device-flow = []

[lib]
name = "kubidm_cli"
path = "src/cli/lib.rs"
test = false
doctest = false

[[bin]]
name = "kubidm"
path = "src/cli/main.rs"
doc = false
test = false
doctest = false

[[bin]]
name = "kubidm_ssh_authorizedkeys_direct"
path = "src/ssh_authorizedkeys.rs"
test = true
doctest = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
compact_jwt = { workspace = true }
dialoguer = { workspace = true }
libc = { workspace = true }
kubidm_client = { workspace = true }
kubidm_lib_file_permissions = { workspace = true }
kubidm_proto = { workspace = true }
qrcode = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shellexpand = { workspace = true }
time = { workspace = true, features = ["serde", "std", "local-offset"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["rt", "macros", "fs", "signal"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
zxcvbn = { workspace = true }
regex = { workspace = true }
webauthn-authenticator-rs = { workspace = true, default-features = false }

## See src/cli/webauthn/mod.rs for which features are
## required for which target_os here
[target."cfg(target_os = \"windows\")".dependencies.webauthn-authenticator-rs]
workspace = true
features = ["win10"]

[target."cfg(any(target_os = \"linux\", target_os = \"macos\", target_os = \"freebsd\"))".dependencies.webauthn-authenticator-rs]
workspace = true
features = ["mozilla"]


[dev-dependencies]
sketching = { workspace = true }

[build-dependencies]
kubidm_proto = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
kubidm_build_profiles = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
time = { workspace = true }

## Debian packaging
[package.metadata.deb]
name = "kubidm"
maintainer = "James Hodgkinson <james@terminaloutcomes.com>"
depends = ["libc6", "libudev1"]
section = "admin"
priority = "optional"
changelog = "../../target/debian/changelog" # Generated by packaging scripts
assets = [
    [
        "target/release/kubidm",
        "usr/bin/",
        "755",
    ],
    [
        "target/release/kubidm_ssh_authorizedkeys_direct",
        "usr/bin/",
        "755",
    ],
    [
        "../../examples/config",
        "usr/share/kubidm/",
        "444",
    ],
]
maintainer-scripts = "debian/"

[package.metadata.cargo-machete]
ignored = ["clap_complete", "kubidm_build_profiles"]
