---
name: Linting checks

# Trigger the workflow on push
"on":
  push:
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  KUBIDM_BUILD_PROFILE: developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Fallback if sccache unavailable
        run: |
          sccache_available=true
          if ! command -v sccache &>/dev/null; then
            sccache_available=false
          else
            # Test if sccache can actually start its server
            if ! sccache --start-server 2>&1; then
              echo "sccache --start-server failed"
              sccache_available=false
            fi
          fi

          if [ "$sccache_available" = false ]; then
            echo "sccache not available or not working, disabling RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            libpam0g-dev \
            libselinux1-dev \
            libssl-dev \
            libsystemd-dev \
            libtss2-dev \
            libudev-dev \
            pkg-config \
            libtalloc-dev \
            tpm-udev
      - name: "Run clippy"
        run: |
          rustup component add clippy
          cargo clippy --quiet --lib --bins --examples
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Fallback if sccache unavailable
        run: |
          sccache_available=true
          if ! command -v sccache &>/dev/null; then
            sccache_available=false
          else
            # Test if sccache can actually start its server
            if ! sccache --start-server 2>&1; then
              echo "sccache --start-server failed"
              sccache_available=false
            fi
          fi

          if [ "$sccache_available" = false ]; then
            echo "sccache not available or not working, disabling RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
      - name: "Run cargo fmt"
        run: |
          rustup component add rustfmt
          cargo fmt --check
