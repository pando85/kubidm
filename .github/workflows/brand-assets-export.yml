# Temporary generator for the approved branding PR only.
# Removed after it commits the deterministic raster exports.
name: T1.1 asset export (one-time)
on:
  push:
    branches:
      - design/t11-brand-unification
    paths:
      - '.github/workflows/brand-assets-export.yml'
      - 'artwork/brand/**'
      - 'scripts/render-brand-assets.py'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install vector renderer
        run: python -m pip install --disable-pip-version-check 'pillow>=11' 'cairosvg>=2.7' 'brotli>=1.1'
      - name: Export approved T1.1 SVG assets
        run: python scripts/render-brand-assets.py
      - name: Commit generated assets to this pull-request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork/brand/social-preview.png server/core/static/img/favicon.ico server/core/static/img/favicon.png server/core/static/img/logo-32.png server/core/static/img/logo-180.png server/core/static/img/logo-192.png server/core/static/img/logo-256.png server/core/static/img/logo-512.png server/core/static/img/logo-192-maskable.png server/core/static/img/logo-512-maskable.png server/core/static/img/logo.svg.br server/core/static/img/logo-square.svg.br book/theme/favicon.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(brand): render approved T1.1 web and PWA icons"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
