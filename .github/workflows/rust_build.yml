---
name: "Linux Build and Test"
"on":
  push:
    branches:
      - master
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  KUBIDM_BUILD_PROFILE: developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Fallback if sccache unavailable
        run: |
          if ! command -v sccache &>/dev/null; then
            echo "sccache not available, disabling RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            libpam0g-dev \
            libudev-dev \
            libssl-dev \
            libsystemd-dev

      - name: "Build the workspace"
        run: cargo build --locked --workspace
      - name: "Check disk space and size of target, then clean it"
        run: |
          df -h
          echo "Checking base dir"
          du -shc *
          echo "Checking target dir"
          du -shc target/*
          rm -rf target/*

      - name: "Start Silo (S3-compatible storage) for the backup tests"
        env:
          MINIO_ROOT_USER: kubidm-test
          MINIO_ROOT_PASSWORD: kubidm-test-secret
        run: |
          docker run -d --name silo -p 9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "silo is ready"
              exit 0
            fi
            sleep 1
          done
          echo "silo did not become ready in time"
          docker logs silo
          exit 1
      - name: "Run cargo test"
        env:
          KUBIDM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          KUBIDM_TEST_S3_BUCKET: kubidm-test
          KUBIDM_TEST_S3_ACCESS_KEY: kubidm-test
          KUBIDM_TEST_S3_SECRET_KEY: kubidm-test-secret
        run: cargo test
      - name: "Check disk space at the end"
        run: du -shc *
  rust_build_next:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        rust_version: ["beta", "nightly"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust_version }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Fallback if sccache unavailable
        run: |
          if ! command -v sccache &>/dev/null; then
            echo "sccache not available, disabling RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            libpam0g-dev \
            libudev-dev \
            libssl-dev \
            libsystemd-dev

      - name: "Build the workspace"
        run: cargo build --locked --workspace
      - name: "Check disk space and size of target, then clean it"
        run: |
          df -h
          echo "Checking base dir"
          du -shc *
          echo "Checking target dir"
          du -shc target/*
          rm -rf target/*

      - name: "Run cargo test"
        run: cargo test
      - name: "Check disk space at the end"
        run: du -shc *

  run_release:
    runs-on: ubuntu-latest
    env:
      MALLOC_CONF: "thp:always,metadata_thp:always"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Fallback if sccache unavailable
        run: |
          if ! command -v sccache &>/dev/null; then
            echo "sccache not available, disabling RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            libpam0g-dev \
            libudev-dev \
            libssl-dev \
            libsystemd-dev \
            ripgrep
      - name: "Run the release build test script"
        env:
          BUILD_MODE: --release
        run: |
          python -m pip install uv
          # Retry build up to 3 times to handle transient sccache/network failures
          for i in 1 2 3; do
            if ./scripts/test_run_release_server.sh; then
              break
            fi
            if [ $i -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            echo "Build attempt $i failed, retrying in 30 seconds..."
            sleep 30
            # Clear any stuck sccache and retry
            sccache --stop-server 2>/dev/null || true
          done
