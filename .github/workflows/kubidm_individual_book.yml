---
name: "Github Pages - Branch"
"on":
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      parent_id:
        required: true
        type: string
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  KUBIDM_BUILD_PROFILE: developer
  ACTIONS_RUNNER_DEBUG: true
jobs:
  generate_mdbook:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Fallback if sccache unavailable
        run: |
          if ! command -v sccache &>/dev/null; then
            echo "sccache not available, disabling RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            build-essential \
            librust-openssl-dev \
            libssl-dev \
            libudev-dev \
            libpam0g-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the docs
        run: |
          cd /tmp && cargo install --quiet mdbook mdbook-mermaid
          cd $GITHUB_WORKSPACE
          cargo doc --quiet --no-deps
          mdbook build *book
          rm -rf ./docs/
          mkdir -p ./docs/
          mv ./*book/book ./docs/${{ inputs.tag }}
          mkdir -p ./docs/${{ inputs.tag }}/rustdoc/
          find ./target/doc/ -name .lock -exec rm "{}" \;
          mv ./target/doc/* ./docs/${{ inputs.tag }}/rustdoc/
      - name: pykubidm Docs
        run: |
          python -m pip install uv
          cd pykubidm
          uv run --group docs mkdocs build
          cd ..
          mv pykubidm/site ./docs/${{ inputs.tag }}/pykubidm
        continue-on-error: true
      - name: archive things
        run: |
          tar czvf ${{ inputs.tag }}.tar.gz ./docs/
        env:
          ACTIONS_RUNNER_DEBUG: true
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "individual${{ inputs.tag }}"
          path: ${{ inputs.tag }}.tar.gz
        env:
          ACTIONS_RUNNER_DEBUG: true
