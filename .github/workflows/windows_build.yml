---
name: Windows Build and Test

# Trigger the workflow on push to master or pull request
"on":
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:  # so you can run it manually
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_build_kubidm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static-md
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Fallback if sccache unavailable
        run: |
          $sccache_available = $true
          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
            $sccache_available = $false
          } else {
            # Test if sccache can actually start its server
            try {
              $output = sccache --start-server 2>&1
              if ($LASTEXITCODE -ne 0) {
                Write-Host "sccache --start-server failed: $output"
                $sccache_available = $false
              }
            } catch {
              Write-Host "sccache --start-server threw exception: $_"
              $sccache_available = $false
            }
          }

          if (-not $sccache_available) {
            Write-Host "sccache not available or not working, disabling RUSTC_WRAPPER"
            "RUSTC_WRAPPER=" >> $env:GITHUB_ENV
          } else {
            try {
              $null = sccache --show-stats 2>&1
              if ($LASTEXITCODE -ne 0) {
                Write-Host "sccache not working, disabling RUSTC_WRAPPER"
                "RUSTC_WRAPPER=" >> $env:GITHUB_ENV
              }
            } catch {
              Write-Host "sccache check failed, disabling RUSTC_WRAPPER"
              "RUSTC_WRAPPER=" >> $env:GITHUB_ENV
            }
          }

          # The runner appends 'exit $LASTEXITCODE' to every pwsh step, so a failing sccache
          # probe would fail this job even though we handled it above. The probe is best-effort:
          # always report success and let the build run without the cache instead.
          exit 0
        shell: pwsh
      - run: cargo build --locked -p kubidm_client -p kubidm_tools --bin kubidm
      # yamllint disable-line rule:line-length
      - run: cargo test -p kubidm_client -p kubidm_tools
