---
name: Windows Build and Test

# Trigger the workflow on push to master or pull request
"on":
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:  # so you can run it manually
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_build_kubidm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static-md
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Fallback if sccache unavailable
        run: |
          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
            Write-Host "sccache not available, disabling RUSTC_WRAPPER"
            "RUSTC_WRAPPER=" >> $env:GITHUB_ENV
          }
        shell: pwsh
      - run: cargo build --locked -p kubidm_client -p kubidm_tools --bin kubidm
      # yamllint disable-line rule:line-length
      - run: cargo test -p kubidm_client -p kubidm_tools
