[package]
name = "kubidmd_lib"
description = "Kubidm Server Backend Library"
documentation = "https://docs.rs/kubidm/latest/kubidm/"

version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[lib]
name = "kubidmd_lib"
path = "src/lib.rs"
test = true
doctest = false

[features]
default = []
dhat-heap = ["dep:dhat"]
dhat-ad-hoc = ["dep:dhat"]
dev-oauth2-device-flow = []
test = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
base64urlsafedata = { workspace = true }
bitflags = { workspace = true }
chrono = { workspace = true }
compact_jwt = { workspace = true }
concread = { workspace = true }
crypto-glue = { workspace = true }
dhat = { workspace = true, optional = true }
dyn-clone = { workspace = true }
hashbrown = { workspace = true }
idlset = { workspace = true }
itertools = { workspace = true }
kubidm_proto = { workspace = true }
kubidm_lib_crypto = { workspace = true }
ldap3_client = { workspace = true }
ldap3_proto = { workspace = true }
num_enum = { workspace = true }
rand = { workspace = true }
regex = { workspace = true, features = [
    "std",
    "perf",
    "perf-inline",
    "unicode",
    "unicode-gencat",
] }
rustls = { workspace = true }
rusqlite = { workspace = true, features = ["array", "bundled"] }

serde = { workspace = true, features = ["derive"] }
serde_cbor = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sketching = { workspace = true }
smolset = { workspace = true }
sshkey-attest = { workspace = true }
subtle = { workspace = true }
time = { workspace = true, features = ["serde", "std"] }
tokio = { workspace = true, features = ["net", "sync", "time", "rt"] }
reqwest = { workspace = true }
nonempty = { workspace = true, features = ["serialize"] }

tracing = { workspace = true, features = ["attributes"] }
unicode-segmentation = { workspace = true }
url = { workspace = true, features = ["serde"] }
utoipa = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
webauthn-rs = { workspace = true, features = [
    "resident-key-support",
    "preview-features",
    "danger-credential-internals",
] }
webauthn-rs-core = { workspace = true }
x509-cert = { workspace = true }
zxcvbn = { workspace = true }
serde_with = { workspace = true, features = ["time_0_3", "base64"] }
hex = { workspace = true }
lodepng = { workspace = true }
image = { workspace = true, default-features = false, features = [
    "gif",
    "jpeg",
    "webp",
] }
svg = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(target_family = "windows")'.dependencies]
whoami = { workspace = true }

[dev-dependencies]
compact_jwt = { workspace = true, features = ["unsafe_release_without_verify"] }
futures = { workspace = true }
kubidmd_lib_macros = { workspace = true }
kubidm_proto = { workspace = true, features = ["test"] }
toml = { workspace = true }
webauthn-authenticator-rs = { workspace = true, features = [
    "softpasskey",
    "softtoken",
] }

[build-dependencies]
hashbrown = { workspace = true }
kubidm_build_profiles = { workspace = true }
regex = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    "openssl-sys",
    "whoami",
]
