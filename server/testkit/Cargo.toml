[package]
name = "kubidmd_testkit"
description = "Kubidm Server Test Framework"
documentation = "https://docs.rs/kubidm/latest/kubidm/"

version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[lib]
name = "kubidmd_testkit"
path = "src/lib.rs"
test = false
doctest = false

[features]
# default = ["dev-oauth2-device-flow"]


dev-oauth2-device-flow = []

[dependencies]
kubidm_client = { workspace = true }
kubidm_proto = { workspace = true }
kubidmd_core = { workspace = true }
kubidmd_lib = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
sketching = { workspace = true }
testkit-macros = { workspace = true }
tokio = { workspace = true, features = [
    "net",
    "sync",
    "io-util",
    "macros",
    "rt",
] }
tracing = { workspace = true, features = ["attributes"] }
webauthn-authenticator-rs = { workspace = true, features = [
    "softpasskey",
    "softtoken",
] }
url = { workspace = true, features = ["serde"] }

[build-dependencies]
kubidm_build_profiles = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
cidr = { workspace = true }
compact_jwt = { workspace = true, features = ["unsafe_release_without_verify"] }
escargot = "0.5.15"
futures = { workspace = true }
hex = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }
ldap3_client = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
kubidm_lib_crypto = { workspace = true }
uuid = { workspace = true }
jsonschema = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["escargot", "futures", "kubidm_build_profiles"]
