[package]
name = "daemon"
description = "Kubidm Server Daemon"
documentation = "https://docs.rs/kubidm/latest/kubidm/"

version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "kubidmd"
path = "src/main.rs"
doctest = false

[features]
dhat-heap = ["dep:dhat"]
dhat-ad-hoc = ["dep:dhat"]

[dependencies]
kubidm_proto = { workspace = true }
kubidmd_core = { workspace = true }
kubidm_lib_file_permissions = { workspace = true }
sketching = { workspace = true }
futures = { workspace = true }
fs4 = { workspace = true }

dhat = { workspace = true, optional = true }
clap = { workspace = true, features = ["env"] }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { workspace = true }
prctl = { workspace = true }

[target.'cfg(target_family = "windows")'.dependencies]
whoami = { workspace = true }

[target.'cfg(not(target_family = "windows"))'.dependencies]
kubidm_utils_users = { workspace = true }

[build-dependencies]
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
kubidm_build_profiles = { workspace = true }
kubidm_proto = { workspace = true }
sketching = { workspace = true }
uuid = { workspace = true }

## Debian packaging
[package.metadata.deb]
name = "kubidmd"
maintainer = "James Hodgkinson <james@terminaloutcomes.com>"
depends = [
	"libc6",
	"tpm-udev"
]
section = "network"
priority = "optional"
changelog = "../../target/debian/changelog"  # Generated by platform/debian/build_debs.sh
assets = [
    [ "target/release/kubidmd", "usr/bin/", "755" ],
  	[ "debian/group.conf", "usr/lib/sysusers.d/kubidmd.conf", "644" ],
    [ "debian/server.toml", "etc/kubidmd/server.toml", "640" ],
    [ "../../examples/server.toml", "usr/share/kubidmd/", "444" ],
    [ "../core/static/**/*", "usr/share/kubidmd/static", "444" ],
]
maintainer-scripts = "debian/"
systemd-units = [
	{ unit-name = "kubidmd", enable = false},  # Cannot start without manual config
]


[package.metadata.cargo-machete]
ignored = ["clap_complete", "kubidm_build_profiles"]
